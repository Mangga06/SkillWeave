services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillweave
      POSTGRES_USER: skillweave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillweave"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://skillweave:${POSTGRES_PASSWORD:-local-development-only}@db/skillweave
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
  web:
    build: frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  postgres_data:
